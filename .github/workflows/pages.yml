name: Publicar aplicativo no GitHub Pages

on:
  push:
    branches: [master, fix/auth-registration-audit]
    paths:
      - 'mobile/**'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/pages.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Instalar interface
        run: npm ci --prefix mobile
      - name: Validar tipos e lint
        run: npm --prefix mobile run typecheck && npm --prefix mobile run lint
      - name: Gerar aplicativo para o Pages
        run: npm run build:pages
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
